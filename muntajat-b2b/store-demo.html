/* ============================================================
   MUNTAJAT B2B — SHARED DESIGN SYSTEM  (base.css)
   Single source of truth for tokens, type, buttons, cards,
   editorial primitives and the Shopify-safe motion layer.
   Inlined by scripts/gen_store.py (SPA) and scripts/gen_locations.py
   (static location pages). Portable verbatim into a Shopify theme.
   Human guide: docs/design-system.md
   ============================================================ */
:root{
  /* core palette */
  --bg:#f8eddf; --surf:#fff; --tx:#23252d; --ink:#23252d;
  --mut:#5e616b; --faint:#9a9aa2; --bd:#e6ddcb;
  /* brand accents */
  --teal:#2d70c5; --tealbg:#e7f0fb; --tealbd:#b9d4f0;
  --gold:#f3be46; --goldd:#b07f0c; --goldbg:#fcf1cf; --gold-ink:#3a2a00;
  --purp:#534ab7; --purpbg:#eeedfe; --purpd:#3c3489;
  --graybg:#f1eadb; --grayd:#55534c; --amber:#b06f12; --amberbg:#fbf0db;
  /* brand secondary accents (from the official guide) */
  --green:#90b166; --greenbg:#edf3e4; --greend:#5f8038; --terra:#ba6a49; --terrabg:#f6ebe4; --terrad:#9a4f31;
  /* dark surface */
  --hero-navy:#214b86; --ink-mut:#c3d2e8;
  /* semantic status */
  --ok-bg:#e6f5ec; --ok-tx:#1f7a44; --ok-dot:#28a35a;
  --low-bg:#fdf3d4; --low-tx:#9a6a06; --low-dot:#e0a818;
  --out-bg:#f0eef0; --out-tx:#8a8a92; --out-dot:#b6b6bd;
  /* typography */
  --font-display:'Fraunces',Georgia,serif;
  --font-display-ar:'Tajawal',sans-serif;
  --font-body:'Helvetica Neue',Helvetica,Arial,'Tajawal','Noto Sans Arabic',system-ui,sans-serif;
  /* radius ramp */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:999px;
  /* elevation (ink-tinted, never pure black) */
  --sh-1:0 4px 12px rgba(38,35,63,.06);
  --sh-2:0 10px 26px rgba(38,35,63,.08);
  --sh-3:0 20px 44px rgba(38,35,63,.11);
  --sh-pop:0 14px 38px rgba(38,35,63,.13);
  /* layout + motion */
  --container:1180px; --gutter:24px;
  --ease:cubic-bezier(.16,1,.3,1);
}

/* — Focus visibility (keyboard only) — */
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px}
:focus:not(:focus-visible){outline:none}

/* — Editorial primitives — */
.kicker{font-size:12.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--goldd)}
.dsp{font-family:var(--font-display);font-weight:600;letter-spacing:-.02em}
[dir=rtl] .dsp{font-family:var(--font-display-ar);font-weight:800;letter-spacing:0}
.seclabel{display:flex;align-items:center;gap:13px;font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:-.01em;color:var(--tx);margin:0 0 22px}
.seclabel .n{font-family:var(--font-body);font-size:12px;font-weight:800;color:var(--goldd);background:var(--goldbg);min-width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
[dir=rtl] .seclabel{font-family:var(--font-display-ar);font-weight:800}
.stat-row{display:flex;flex-wrap:wrap;gap:14px 42px}
.stat-row .s{display:flex;flex-direction:column}
.stat-row b{font-family:var(--font-display);font-size:30px;font-weight:600;color:var(--tx);display:inline-flex;align-items:center;gap:8px;line-height:1;font-variant-numeric:tabular-nums}
.stat-row .s span{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin-top:5px}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--ok-dot);display:inline-block;animation:mb-pulse 1.8s infinite}

/* — Canonical buttons — */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-weight:700;font-size:15px;border:1px solid transparent;border-radius:var(--r-md);padding:13px 21px;cursor:pointer;text-decoration:none;line-height:1;transition:transform .2s var(--ease),background .2s,box-shadow .2s,border-color .2s,filter .2s}
.btn-primary{background:var(--tx);color:#fff}
.btn-primary:hover{background:#15131f;box-shadow:var(--sh-2);transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:var(--gold-ink);font-weight:800}
.btn-gold:hover{filter:brightness(1.04);box-shadow:0 12px 26px rgba(244,190,44,.42);transform:translateY(-1px)}
.btn-ghost{background:var(--surf);color:var(--tx);border-color:var(--bd)}
.btn-ghost:hover{border-color:var(--tx)}
.btn-lg{padding:15px 27px;font-size:16px}

/* — Card hover language — */
.u-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-lg);transition:transform .22s var(--ease),box-shadow .22s,border-color .22s}
.u-card:hover{transform:translateY(-4px);box-shadow:var(--sh-3);border-color:var(--goldd)}

/* — Motion layer (Shopify-portable; transform/opacity only) — */
@keyframes mb-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes mb-zoom{from{transform:scale(1.05)}to{transform:scale(1)}}
@keyframes mb-ken{0%{transform:scale(1)}100%{transform:scale(1.07) translate3d(-1.2%,-1%,0)}}
@keyframes mb-marquee{to{transform:translateX(-50%)}}
@keyframes mb-pulse{0%{box-shadow:0 0 0 0 rgba(40,163,90,.5)}70%{box-shadow:0 0 0 7px rgba(40,163,90,0)}100%{box-shadow:0 0 0 0 rgba(40,163,90,0)}}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:calc(var(--i,0)*70ms)}
.reveal.in{opacity:1;transform:none}
@keyframes mb-viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view.vin{animation:mb-viewin .34s var(--ease)}
.an-rise{animation:mb-rise .7s var(--ease) both;animation-delay:calc(var(--d,0)*1ms)}
.kb{overflow:hidden}
.kb img[data-ken]{animation:mb-ken 22s ease-in-out infinite alternate;will-change:transform}
.mq{overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.mq__track{display:flex;width:max-content;animation:mb-marquee 42s linear infinite}
.mq:hover .mq__track,.mq:focus-within .mq__track{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){
  .btn:hover{transform:none}
  .u-card:hover{transform:none}
  .reveal{opacity:1;transform:none;transition:none}
  .an-rise{animation:none}
  #view.vin{animation:none}
  .kb img[data-ken]{animation:none}
  .live-dot{animation:none}
  .mq__track{animation:none;flex-wrap:wrap;justify-content:center}
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font-body);font-size:15px;line-height:1.55}

.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:12px 26px;gap:20px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;cursor:pointer}

.lng{font-family:inherit;font-size:14px;font-weight:500;border:1px solid var(--bd);background:var(--surf);border-radius:9px;padding:7px 14px;cursor:pointer;color:var(--tx);white-space:nowrap}
.lng:hover{border-color:var(--teal);color:var(--teal)}
.search{position:relative;flex:0 1 300px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:11px;padding:0 12px;height:40px}

.srow{display:flex;gap:11px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}

@media(max-width:980px){.search{flex:1}}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
.crumbs{font-size:13px;color:var(--mut);margin-bottom:18px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}

.crumbs .sep{color:var(--faint)}

[dir=rtl] .h1{font-family:'Tajawal',sans-serif;font-weight:800;letter-spacing:0}
[dir=rtl] .sech,[dir=rtl] .hero h2{font-family:'Tajawal',sans-serif;font-weight:800}
.sub{color:var(--mut);margin-bottom:22px;font-size:14.5px}
/* hero */
.hero{background:linear-gradient(115deg,#2f6fb0,#21456b);color:#fff;border-radius:22px;padding:40px 44px;margin-bottom:30px;position:relative;overflow:hidden}

.hero .chip{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:#4a3700;font-weight:700;padding:7px 13px;border-radius:30px;font-size:13px;margin-bottom:16px}

/* animal cards */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:34px}
.acard{background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:22px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}

/* category cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.ccard{background:var(--surf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s}

.sa-land path{fill:#f0eada;stroke:#ddd3bf;stroke-width:14;stroke-linejoin:round}
.sa-pin{cursor:pointer}
.sa-ring{fill:rgba(244,190,44,.28);transform-box:fill-box;transform-origin:center}
.sa-dot{fill:var(--goldd);stroke:#fff;stroke-width:3;transform-box:fill-box;transform-origin:center;transition:.2s}

/* Six branches share the city "Riyadh", so a branch page is named
   <city> when the city has one branch and <city>-<branch> when it
   has several — the same rule _genbranches.py files them under. */
function B2B_DEPOT(s){
  if (!s) return "#/showrooms";
  const city = slug(s.city);
  const long = city + "-" + slug(s.name);
  if (B2B_DEPOT_PAGES[long]) return "cash-and-carry/" + long + ".html";
  if (B2B_DEPOT_PAGES[city]) return "cash-and-carry/" + city + ".html";
  return "#/showrooms";
}
/* Pins on the Saudi map were a fixed array of 10 positions, one per
   demo branch, indexed by position. The live branch list is a
   different set in a different order, so every pin sat on the wrong
   city — and an 11th branch read past the end of the array and threw.
   Project from the branch coordinates instead. The constants are a
   least-squares fit of the original ten pins against their real
   lat/lng (equirectangular, max residual 0.7px). */
function B2B_PIN(s, i){
  if (s && s.lng != null && s.lat != null)
    return [48.2626 * s.lng - 1665.1798, -54.6557 * s.lat + 1823.3191];
  return (typeof PINXY !== "undefined" && PINXY[i]) || null;
}

function B2B_LOGOERR(im, alt){

}

function B2B_STAT(key, fallback){
  const v = (typeof S !== 'undefined' && S.stats) ? S.stats[key] : null;
  return (v === null || v === undefined) ? fallback : v;
}
function B2B_APPLY_STATS(){
  const s = (typeof S !== 'undefined' && S.stats) || {};
  const map = {
    accounts:  s.accounts,
    brands:    s.brands,
    products:  s.products,
    showrooms: s.showrooms,
  };
  Object.keys(UI).forEach(function (lng) {
    const dict = UI[lng];
    Object.keys(dict).forEach(function (k) {
      if (typeof dict[k] !== 'string' || dict[k].indexOf('{{') < 0) return;
      dict[k] = dict[k].replace(/\{\{(\w+)\}\}/g, function (m, name) {
        const v = map[name];
        return (v === null || v === undefined) ? '' : Number(v).toLocaleString(
          lng === 'ar' ? 'ar-EG' : 'en-US');
      });
    });
  });
}

function productView(id){
  const p = S.products && S.products[id];
  if (p && p.enr && !p._enrLoaded) {
    p._enrLoaded = 1;
    fetch((window.B2B_API || '') + '/api/store/b2b/product/' + encodeURIComponent(id),
          {cache: 'no-store'})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        Object.assign(p, d);
        if ((location.hash || '').indexOf('/p/' + id) >= 0) productViewRender(id);
      })
      .catch(function () { p._enrLoaded = 0; });   // let a later visit retry
  }
  return productViewRender(id);
}

  if(ben.length){h+=`<details open><summary><span class="lb"><i class="ti ti-rosette-discount-check"></i>${esc(t.ben)}</span><i class="ti ti-chevron-down cv"></i></summary><div class="bd"><div class="blist">${ben.map(b=>`<div class="bi"><i class="ti ti-check"></i><span>${esc(b)}</span></div>`).join('')}</div></div></details>`;}
  if(nutr.length){h+=`<details ${ben.length?'':'open'}><summary><span class="lb"><i class="ti ti-chart-bar"></i>${esc(t.nut)}</span><i class="ti ti-chevron-down cv"></i></summary><div class="bd"><div class="ntab">${nutr.map(n=>`<div class="nr"><span class="nl">${esc(n[0])}</span><span class="nv">${esc(n[1])}</span></div>`).join('')}</div></div></details>`;}
  const ing=L(p,'ing');
  if(ing.length){h+=`<details><summary><span class="lb"><i class="ti ti-leaf"></i>${esc(t.ing)} <span style="color:var(--faint);font-weight:400;font-size:13px">(${ing.length})</span></span><i class="ti ti-chevron-down cv"></i></summary><div class="bd"><div class="chips">${ing.map(i=>`<span class="ing">${esc(i)}</span>`).join('')}</div></div></details>`;}
  const desc=lang==='ar'?(p.descar||p.desc):p.desc;
  if(desc){h+=`<details><summary><span class="lb"><i class="ti ti-file-text"></i>${esc(t.desc)}</span><i class="ti ti-chevron-down cv"></i></summary><div class="bd"><p class="desc">${esc(desc)}</p></div></details>`;}
  const tags=L(p,'tags');
  if(tags.length){h+=`<div class="sec"><div class="sh"><i class="ti ti-tags"></i>${esc(t.tags)}</div><div class="chips">${tags.map(x=>`<span class="tg">${esc(x)}</span>`).join('')}</div></div>`;}
  const kw=L(p,'kw');
  if(kw.length){h+=`<div class="kw"><div class="kwn"><i class="ti ti-eye-off"></i>${esc(t.kw)}</div><div class="chips">${kw.map(x=>`<span class="kwc">${esc(x)}</span>`).join('')}</div></div>`;}
  if(p.enr){h+=`<div class="bloom"><i class="ti ti-sparkles"></i><span>${esc(t.foot)}</span></div>`;}
  const relIds=((S.index[a]&&S.index[a][c])?S.index[a][c].ids:[]).filter(x=>x!==id).slice(0,6);
  if(relIds.length){h+=`<div class="sec"><div class="sh"><i class="ti ti-layout-grid"></i>${esc(t.related)}</div><div class="pgrid">${relIds.map(rid=>prodCard(S.products[rid])).join('')}</div></div>`;}
  set(h);
  const sb=document.getElementById('stickybuy');
  if(sb){const ok=BIZ?depotStock(p.id)>0:true;const cta=BIZ?(ok?`<button class="btn btn-primary" onclick="addToOrder('${p.id}',1,this)"><i class="ti ti-plus"></i> ${esc(t.w_add)}</button>`:`<button class="btn btn-primary" disabled><i class="ti ti-ban"></i> ${esc(t.w_out)}</button>`):`<button class="btn btn-primary"><i class="ti ti-message-2"></i> ${esc(t.add)}</button>`;sb.insertAdjacentHTML('beforeend',`<div class="sb-info"><img src="${esc(p.img)}"${IE} alt=""><div><div class="sb-nm">${esc(title)}</div><div class="sb-pr">${money(p.price)}</div></div></div>${cta}`);initStickyBuy();}
  markNav(a);
}
function markNav(a){document.querySelectorAll('#navlinks a').forEach(e=>e.classList.toggle('on',e.dataset.a===a));}
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean).map(decodeURIComponent);
  renderBizBar();
  if(!parts.length) return home();
  if(parts[0]==='a') return animalView(parts[1]);
  if(parts[0]==='c') return categoryView(parts[1],parts[2]);
  if(parts[0]==='p') return productView(parts[1]);
  if(parts[0]==='s') return searchView(parts.slice(1).join('/'));
  if(parts[0]==='brands') return brandsView();
  if(parts[0]==='brand') return brandView(parts.slice(1).join('/'));
  if(parts[0]==='about') return aboutView();
  if(parts[0]==='catalog') return catalogView();
  if(parts[0]==='showrooms') return showroomsView();
  if(parts[0]==='wholesale') return parts[1]==='welcome'?welcomeView():wholesaleView();
  if(parts[0]==='cart') return cartView();
  if(parts[0]==='order') return orderDoneView();
  if(parts[0]==='manager') return managerView();
  home();
}
function setLang(){const t=U();document.body.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;document.getElementById('lng').textContent=t.tog;const qel=document.getElementById('q');if(qel)qel.placeholder=t.searchph;buildNav();renderFooter();}
document.getElementById('lng').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';B2B_APPLY_STATS();setLang();route();});
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0);closeMenu();closeLightbox();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLightbox();return;}if(e.key==='Enter'||e.key===' '){var el=e.target;if(el&&el.hasAttribute&&el.hasAttribute('onclick')&&!/^(INPUT|TEXTAREA|BUTTON|SELECT)$/.test(el.tagName)&&!(el.tagName==='A'&&el.hasAttribute('href'))){e.preventDefault();el.click();}}});
function closeMenu(){var n=document.querySelector('.nav');if(n)n.classList.remove('open');}
document.getElementById('navtoggle').addEventListener('click',function(){document.querySelector('.nav').classList.toggle('open');});
(function(){const qel=document.getElementById('q');let db;qel.addEventListener('input',e=>{clearTimeout(db);db=setTimeout(()=>renderDrop(e.target.value),110);});qel.addEventListener('keydown',e=>{if(e.key==='Enter')goSearch();else if(e.key==='Escape'){closeSearch();qel.blur();}});qel.addEventListener('focus',e=>{if(e.target.value.trim())renderDrop(e.target.value);});document.addEventListener('click',e=>{if(!e.target.closest('#searchbox'))closeSearch();});})();
B2B_APPLY_STATS();setLang();route();
</script><script id="b2b-boot">
/* Catalogue comes from sapconnect at runtime — nothing is stored in this page.
   Prices are SAP price list 2 ("Retail PL - Muntajat"); wholesale never leaves
   the server. See B2bCatalogController. */
(function () {
  /* Tries the deployed backend first, then a local `php artisan serve`, so the
     page works both in production and while the endpoint is still being rolled
     out. ?api=<base> forces one specific backend. */
  var forced = new URLSearchParams(location.search).get('api');
  var bases = forced ? [forced] : ['https://sapapi.muntajat.sa', 'http://127.0.0.1:8123'];

  function note(msg, bad) {
    var el = document.getElementById('b2b-status') || (function () {
      var d = document.createElement('div');
      d.id = 'b2b-status';
      d.style.cssText = 'padding:14px 18px;font:600 14px/1.7 system-ui,sans-serif;' +
        'text-align:center;position:relative;z-index:99';
      document.body.insertAdjacentElement('afterbegin', d);
      return d;
    })();
    el.style.background = bad ? '#fbe9e7' : '#eef4fb';
    el.style.color = bad ? '#8a2c1d' : '#24507f';
    el.innerHTML = msg;
  }

  function boot(d) {
    window.B2B_API = d.__base;                 // productView() lazy-loads from here
    d.store.stats = d.stats || {};             // headline figures ride along with S
    document.getElementById('store').textContent = JSON.stringify(d.store);
    document.getElementById('brands').textContent = JSON.stringify(d.brands);
    document.getElementById('showrooms').textContent = JSON.stringify(d.showrooms);
    var s = document.createElement('script');
    s.textContent = document.getElementById('b2b-app').textContent;
    document.body.appendChild(s);
    var el = document.getElementById('b2b-status');
    if (el) el.remove();
  }

  function attempt(i) {
    if (i >= bases.length) {
      note('تعذّر تحميل الكتالوج من sapconnect.<br>' +
           'جرّبنا: ' + bases.join(' ثم ') + '<br>' +
           'شغّل الباك-إند: <code>php artisan serve --port=8123</code>' +
           ' أو انشر الـendpoint على الخادم.', true);
      return;
    }
    note('جارٍ تحميل الكتالوج من ' + bases[i] + ' …', false);
    fetch(bases[i] + '/api/store/b2b/catalog', {cache: 'no-store'})
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { d.__base = bases[i]; boot(d); })
      .catch(function () { attempt(i + 1); });
  }

  attempt(0);
})();
</script>
