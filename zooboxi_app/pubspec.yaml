name: zooboxi_app
description: "Zooboxi — زوبوكسي · متجر مستلزمات الحيوانات الأليفة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0

  # Networking + storage
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  # App-sandbox path for the fresh-install marker that clears a stale keychain.
  path_provider: ^2.1.5
  uuid: ^4.5.1

  # UI toolkit
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  google_fonts: ^8.1.0

  # Location + maps
  geolocator: ^14.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Scanner + external links
  mobile_scanner: ^7.0.1
  url_launcher: ^6.3.2
  flutter_custom_tabs: ^2.2.0

  intl: any

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # gen-l10n: lib/l10n/app_ar.arb (template) + app_en.arb → AppLocalizations
  generate: true
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    # Single-glyph font carrying the official Saudi Riyal symbol at U+E900.
    # Every TextStyle lists it in fontFamilyFallback so ﷼ renders inline.
    - family: SaudiRiyal
      fonts:
        - asset: assets/fonts/SaudiRiyal.otf

# Launcher icon: the brand submark (smiling delivery box + coral paw) rendered
# full-bleed from docs/zooboxi-brand-kit/app-icon.svg. Regenerate after changing
# the source: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/app_icon_1024.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#3B8F8E"
  adaptive_icon_foreground: assets/brand/app_icon_1024.png
