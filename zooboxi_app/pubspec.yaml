name: zooboxi_app
description: "Zooboxi — زوبوكسي · متجر مستلزمات الحيوانات الأليفة"
publish_to: 'none'
version: 1.0.0+19

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0

  # Networking + storage
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  # App-sandbox path for the fresh-install marker that clears a stale keychain.
  path_provider: ^2.1.5
  uuid: ^4.5.1

  # UI toolkit
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  # Fires a campaign impression once the creative is actually ≥50% on screen —
  # a banner that scrolled past below the fold was never "shown".
  visibility_detector: ^0.4.0+2

  # Push — Firebase Cloud Messaging. The app runs perfectly without it
  # configured (see PushService): no GoogleService-Info.plist means the whole
  # feature stays folded away rather than crashing on launch.
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0

  # Location + maps
  geolocator: ^14.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Scanner + external links
  mobile_scanner: ^7.0.1
  url_launcher: ^6.3.2
  # A countdown must read the wall clock, or it drifts every time the phone
  # sleeps. `clock` keeps that behaviour while letting tests move time.
  clock: ^1.1.1
  flutter_custom_tabs: ^2.2.0

  # Payments — MyFatoorah's native SDK for the embedded card form (3-D Secure
  # is handled inside the SDK). The hosted page stays as the fallback for
  # Apple Pay and the wallets.
  myfatoorah_flutter: ^3.3.2

  intl: any
  liquid_glass_widgets: ^1.3.0
  share_plus: ^13.3.0
  live_activities: ^2.4.9

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # gen-l10n: lib/l10n/app_ar.arb (template) + app_en.arb → AppLocalizations
  generate: true
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/fonts/OFL.txt

  fonts:
    # Single-glyph font carrying the official Saudi Riyal symbol at U+E900.
    # Every TextStyle lists it in fontFamilyFallback so ﷼ renders inline.
    - family: SaudiRiyal
      fonts:
        - asset: assets/fonts/SaudiRiyal.otf

    # Bundled, not fetched. These are the byte-identical files google_fonts
    # used to download from fonts.gstatic.com on first launch — which meant
    # the whole app rendered in the system font until the network answered,
    # and stayed there forever on a blocked one.
    #
    # Only the weights the app actually asks for are here. Two of them the
    # families never drew — Tajawal has no 600, Manrope no 900 — and until now
    # google_fonts answered those by picking Tajawal Medium and Manrope
    # ExtraBold itself. Tajawal-SemiBold/Manrope-Black are those same drawings
    # restamped with the weight class of the slot they fill, so the app keeps
    # the type it has whether the engine reads the weight from here or from
    # inside the file. Rebuild them with tools/set_font_weight.py.
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Manrope-Black.ttf
          weight: 900

# Launcher icon: the REAL logo, whole — pets, box and wordmark — on the brand's
# own cream paper. Owner's call (2026-09-07): the logo is the logo, wordmark
# included, everywhere it appears.
# Built by tools/build_icons.py from assets/brand/logo_full.png; regenerate the
# platform sizes with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/app_icon_1024.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#FFF7EF"
  # The mark on transparency — Android insets the foreground into its safe
  # circle, so a full-bleed image would lose the box's corners.
  adaptive_icon_foreground: assets/brand/app_mark.png
