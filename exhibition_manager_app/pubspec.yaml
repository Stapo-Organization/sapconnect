name: exhibition_manager_app
description: "Muntajat Exhibition Manager — مدير المعرض"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.4.0

  # Storage
  flutter_secure_storage: ^9.2.0

  # Barcode Scanner
  mobile_scanner: ^7.0.0

  # Camera / photo capture (Quality Control evidence)
  image_picker: ^1.1.2

  # UI Components
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  flutter_svg: ^2.2.2
  animations: ^2.2.0
  flutter_animate: ^4.5.0
  confetti: ^0.8.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
