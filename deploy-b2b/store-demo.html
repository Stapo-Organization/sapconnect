/* ============================================================
   MUNTAJAT B2B — SHARED DESIGN SYSTEM  (base.css)
   Single source of truth for tokens, type, buttons, cards,
   editorial primitives and the Shopify-safe motion layer.
   Inlined by scripts/gen_store.py (SPA) and scripts/gen_locations.py
   (static location pages). Portable verbatim into a Shopify theme.
   Human guide: docs/design-system.md
   ============================================================ */
:root{
  /* core palette */
  --bg:#f8eddf; --surf:#fff; --tx:#23252d; --ink:#23252d;
  --mut:#5e616b; --faint:#9a9aa2; --bd:#e6ddcb;
  /* brand accents */
  --teal:#2d70c5; --tealbg:#e7f0fb; --tealbd:#b9d4f0;
  --gold:#f3be46; --goldd:#b07f0c; --goldbg:#fcf1cf; --gold-ink:#3a2a00;
  --purp:#534ab7; --purpbg:#eeedfe; --purpd:#3c3489;
  --graybg:#f1eadb; --grayd:#55534c; --amber:#b06f12; --amberbg:#fbf0db;
  /* brand secondary accents (from the official guide) */
  --green:#90b166; --greenbg:#edf3e4; --greend:#5f8038; --terra:#ba6a49; --terrabg:#f6ebe4; --terrad:#9a4f31;
  /* dark surface */
  --hero-navy:#214b86; --ink-mut:#c3d2e8;
  /* semantic status */
  --ok-bg:#e6f5ec; --ok-tx:#1f7a44; --ok-dot:#28a35a;
  --low-bg:#fdf3d4; --low-tx:#9a6a06; --low-dot:#e0a818;
  --out-bg:#f0eef0; --out-tx:#8a8a92; --out-dot:#b6b6bd;
  /* typography */
  --font-display:'Fraunces',Georgia,serif;
  --font-display-ar:'Tajawal',sans-serif;
  --font-body:'Helvetica Neue',Helvetica,Arial,'Tajawal','Noto Sans Arabic',system-ui,sans-serif;
  /* radius ramp */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:999px;
  /* elevation (ink-tinted, never pure black) */
  --sh-1:0 4px 12px rgba(38,35,63,.06);
  --sh-2:0 10px 26px rgba(38,35,63,.08);
  --sh-3:0 20px 44px rgba(38,35,63,.11);
  --sh-pop:0 14px 38px rgba(38,35,63,.13);
  /* layout + motion */
  --container:1180px; --gutter:24px;
  --ease:cubic-bezier(.16,1,.3,1);
}

/* — Focus visibility (keyboard only) — */
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px}
:focus:not(:focus-visible){outline:none}

/* — Editorial primitives — */
.kicker{font-size:12.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--goldd)}
.dsp{font-family:var(--font-display);font-weight:600;letter-spacing:-.02em}
[dir=rtl] .dsp{font-family:var(--font-display-ar);font-weight:800;letter-spacing:0}
.seclabel{display:flex;align-items:center;gap:13px;font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:-.01em;color:var(--tx);margin:0 0 22px}
.seclabel .n{font-family:var(--font-body);font-size:12px;font-weight:800;color:var(--goldd);background:var(--goldbg);min-width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
[dir=rtl] .seclabel{font-family:var(--font-display-ar);font-weight:800}
.stat-row{display:flex;flex-wrap:wrap;gap:14px 42px}
.stat-row .s{display:flex;flex-direction:column}
.stat-row b{font-family:var(--font-display);font-size:30px;font-weight:600;color:var(--tx);display:inline-flex;align-items:center;gap:8px;line-height:1;font-variant-numeric:tabular-nums}
.stat-row .s span{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin-top:5px}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--ok-dot);display:inline-block;animation:mb-pulse 1.8s infinite}

/* — Canonical buttons — */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-weight:700;font-size:15px;border:1px solid transparent;border-radius:var(--r-md);padding:13px 21px;cursor:pointer;text-decoration:none;line-height:1;transition:transform .2s var(--ease),background .2s,box-shadow .2s,border-color .2s,filter .2s}
.btn-primary{background:var(--tx);color:#fff}
.btn-primary:hover{background:#15131f;box-shadow:var(--sh-2);transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:var(--gold-ink);font-weight:800}
.btn-gold:hover{filter:brightness(1.04);box-shadow:0 12px 26px rgba(244,190,44,.42);transform:translateY(-1px)}
.btn-ghost{background:var(--surf);color:var(--tx);border-color:var(--bd)}
.btn-ghost:hover{border-color:var(--tx)}
.btn-lg{padding:15px 27px;font-size:16px}

/* — Card hover language — */
.u-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-lg);transition:transform .22s var(--ease),box-shadow .22s,border-color .22s}
.u-card:hover{transform:translateY(-4px);box-shadow:var(--sh-3);border-color:var(--goldd)}

/* — Motion layer (Shopify-portable; transform/opacity only) — */
@keyframes mb-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes mb-zoom{from{transform:scale(1.05)}to{transform:scale(1)}}
@keyframes mb-ken{0%{transform:scale(1)}100%{transform:scale(1.07) translate3d(-1.2%,-1%,0)}}
@keyframes mb-marquee{to{transform:translateX(-50%)}}
@keyframes mb-pulse{0%{box-shadow:0 0 0 0 rgba(40,163,90,.5)}70%{box-shadow:0 0 0 7px rgba(40,163,90,0)}100%{box-shadow:0 0 0 0 rgba(40,163,90,0)}}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:calc(var(--i,0)*70ms)}
.reveal.in{opacity:1;transform:none}
@keyframes mb-viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view.vin{animation:mb-viewin .34s var(--ease)}
.an-rise{animation:mb-rise .7s var(--ease) both;animation-delay:calc(var(--d,0)*1ms)}
.kb{overflow:hidden}
.kb img[data-ken]{animation:mb-ken 22s ease-in-out infinite alternate;will-change:transform}
.mq{overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.mq__track{display:flex;width:max-content;animation:mb-marquee 42s linear infinite}
.mq:hover .mq__track,.mq:focus-within .mq__track{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){
  .btn:hover{transform:none}
  .u-card:hover{transform:none}
  .reveal{opacity:1;transform:none;transition:none}
  .an-rise{animation:none}
  #view.vin{animation:none}
  .kb img[data-ken]{animation:none}
  .live-dot{animation:none}
  .mq__track{animation:none;flex-wrap:wrap;justify-content:center}
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font-body);font-size:15px;line-height:1.55}
[dir=rtl]{font-family:'Tajawal','Noto Sans Arabic',sans-serif}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:12px 26px;gap:20px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;cursor:pointer}
.logo i{color:var(--teal);font-size:25px}
.navlinks{display:flex;gap:8px;flex:1}
.navlinks a{font-size:14px;color:var(--mut);padding:7px 12px;border-radius:9px;cursor:pointer}
.navlinks a:hover{background:var(--bg);color:var(--tx)}
.navlinks a.on{color:var(--goldd);background:var(--goldbg)}
.navr{display:flex;align-items:center;gap:15px;color:var(--mut)}
.navr i{font-size:20px;cursor:pointer}
.lng{font-family:inherit;font-size:14px;font-weight:500;border:1px solid var(--bd);background:var(--surf);border-radius:9px;padding:7px 14px;cursor:pointer;color:var(--tx);white-space:nowrap}
.lng:hover{border-color:var(--teal);color:var(--teal)}
.search{position:relative;flex:0 1 300px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:11px;padding:0 12px;height:40px}
.search:focus-within{border-color:var(--teal);background:#fff}
.search>i{color:var(--faint);font-size:19px}

.sdrop{position:absolute;top:48px;inset-inline-start:0;width:400px;max-width:84vw;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 14px 38px rgba(0,0,0,.13);padding:6px;display:none;z-index:40;max-height:72vh;overflow:auto}
.sdrop.on{display:block}
.srow{display:flex;gap:11px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.srow:hover{background:var(--bg)}
.srow img{width:42px;height:42px;object-fit:contain;background:#fff;border:1px solid var(--bd);border-radius:8px;flex-shrink:0}
.srow .sn{font-size:13px;font-weight:500;line-height:1.3}
.srow .sb{font-size:11px;color:var(--faint)}
.srow .sp{font-size:13px;font-weight:700;color:var(--teal);margin-inline-start:auto;white-space:nowrap}
.sall{text-align:center;padding:11px;font-size:13px;font-weight:600;color:var(--teal);cursor:pointer;border-top:1px solid var(--bd);margin-top:4px}

.sempty{padding:18px;text-align:center;color:var(--faint);font-size:13px}
.navmenu{display:flex;flex:1;align-items:center;gap:16px;min-width:0}
.navtoggle{display:none;background:transparent;border:1px solid var(--bd);border-radius:9px;width:40px;height:40px;align-items:center;justify-content:center;font-size:20px;color:var(--tx);cursor:pointer}
@media(max-width:980px){.search{flex:1}}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
.crumbs{font-size:13px;color:var(--mut);margin-bottom:18px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.crumbs a{cursor:pointer}.crumbs a:hover{color:var(--teal)}
.crumbs .sep{color:var(--faint)}
.h1{font-family:'Fraunces',Georgia,serif;font-size:31px;font-weight:600;letter-spacing:-.015em;margin:0 0 4px}
[dir=rtl] .h1{font-family:'Tajawal',sans-serif;font-weight:800;letter-spacing:0}
[dir=rtl] .sech,[dir=rtl] .hero h2{font-family:'Tajawal',sans-serif;font-weight:800}
.sub{color:var(--mut);margin-bottom:22px;font-size:14.5px}
/* hero */
.hero{background:linear-gradient(115deg,#2f6fb0,#21456b);color:#fff;border-radius:22px;padding:40px 44px;margin-bottom:30px;position:relative;overflow:hidden}
[dir=rtl] .hero{background:linear-gradient(245deg,#2f6fb0,#21456b)}
.hero h2{font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:600;letter-spacing:-.015em;margin:0 0 10px;max-width:560px;line-height:1.08}
.hero p{margin:0;opacity:.92;max-width:520px;font-size:15px}
.hero .chip{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:#4a3700;font-weight:700;padding:7px 13px;border-radius:30px;font-size:13px;margin-bottom:16px}
.hero i.bgp{position:absolute;font-size:230px;opacity:.08;inset-inline-end:-20px;top:-30px}
.sech{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;display:flex;align-items:center;gap:9px}
/* animal cards */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:34px}
.acard{background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:22px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
.acard:hover{border-color:var(--goldd);transform:translateY(-3px);box-shadow:var(--sh-2)}
.acard .ai{width:54px;height:54px;border-radius:14px;background:var(--tealbg);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.acard .ai i{font-size:30px;color:var(--teal)}
.acard .an{font-size:18px;font-weight:600}
.acard .ac{font-size:13px;color:var(--faint)}
/* category cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.ccard{background:var(--surf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s}
.ccard:hover{border-color:var(--goldd);transform:translateY(-3px);box-shadow:var(--sh-2)}
.ccard .cim{height:130px;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--bd)}
.ccard .cim img{max-height:108px;max-width:80%;object-fit:contain}
.ccard .cb{padding:14px 16px}
.ccard .cn{font-weight:600;font-size:15px}
.ccard .cc{font-size:12.5px;color:var(--faint);margin-top:3px}
/* product grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.pcard{background:var(--surf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s;position:relative;display:flex;flex-direction:column}
.pcard:hover{border-color:var(--goldd);transform:translateY(-3px);box-shadow:var(--sh-2)}
.pcard .pim{height:170px;background:#fff;display:flex;align-items:center;justify-content:center;padding:12px}
.pcard .pim img{max-height:146px;max-width:100%;object-fit:contain}
.pcard .pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .pbrand{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.pcard .pname{font-size:13.5px;font-weight:500;line-height:1.35;flex:1}

.enr{position:absolute;inset-inline-start:10px;top:10px;background:var(--purp);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:30px;display:inline-flex;align-items:center;gap:4px}
.count{color:var(--faint);font-weight:400;font-size:14px}

.sa-land path{fill:#f0eada;stroke:#ddd3bf;stroke-width:14;stroke-linejoin:round}
.sa-pin{cursor:pointer}
.sa-ring{fill:rgba(244,190,44,.28);transform-box:fill-box;transform-origin:center}
.sa-dot{fill:var(--goldd);stroke:#fff;stroke-width:3;transform-box:fill-box;transform-origin:center;transition:.2s}

<script>
const S=JSON.parse(document.getElementById('store').textContent);
const BRANDS=JSON.parse(document.getElementById('brands').textContent);
const SHOW=JSON.parse(document.getElementById('showrooms').textContent);
const RETAILERS=[{n:'Noon',l:'assets/retailers/noon.png',u:'https://www.noon.com/saudi-en'},{n:'Amazon',l:'assets/retailers/amazon.png',u:'https://www.amazon.sa'},{n:'KeeMart',s:'by Keeta',l:'assets/retailers/keeta.png',u:'https://www.keeta.com'},{n:'Ninja',l:'assets/retailers/ninja.png',u:'https://ninja.sa'}];
let BRANDIDX=null, CURSUBS=[], ROSTER=null;
const BRANDALIAS={'Felyn Go':'Feline GO','Felyngo':'Feline GO','MPB':'MPS'};
function bkey(s){s=String(s||'').trim();return BRANDALIAS[s]||s;}
function bfuzzy(a,b){const na=bnorm(a),nb=bnorm(b);if(!na||!nb)return false;if(na===nb)return true;return na.length>=4&&nb.length>=4&&(na.includes(nb)||nb.includes(na));}
function brandRoster(){
  if(ROSTER)return ROSTER;
  const idx=brandIndex();const prod={};
  Object.keys(idx).forEach(k=>{const kk=bkey(k);(prod[kk]=prod[kk]||[]).push(...idx[k]);});
  const used={},list=[];
  BRANDS.forEach(b=>{const mk=Object.keys(prod).filter(pk=>bfuzzy(b.name,pk));let ids=[];mk.forEach(k=>{used[k]=1;ids=ids.concat(prod[k]);});list.push({name:b.name,logo:b.logo,ids,key:mk[0]||b.name});});
  Object.keys(prod).forEach(pk=>{if(!used[pk])list.push({name:pk,logo:'',ids:prod[pk],key:pk});});
  list.sort((x,y)=>y.ids.length-x.ids.length);
  ROSTER=list;return list;
}
function rosterFind(name){return brandRoster().find(b=>bnorm(b.name)===bnorm(name)||bnorm(b.key)===bnorm(name));}
/* ---------- B2B wholesale portal (simulated end-to-end prototype) ---------- */
let BIZ=null, CART={}, ORDERS=[], LASTORDER=null;
try{ BIZ=JSON.parse(localStorage.getItem('mb2b_biz')||'null'); CART=JSON.parse(localStorage.getItem('mb2b_cart')||'{}'); ORDERS=JSON.parse(localStorage.getItem('mb2b_orders')||'[]'); }catch(e){}
function bizSave(){try{localStorage.setItem('mb2b_biz',JSON.stringify(BIZ));localStorage.setItem('mb2b_cart',JSON.stringify(CART));localStorage.setItem('mb2b_orders',JSON.stringify(ORDERS));}catch(e){}}
function depotIdx(){return BIZ?BIZ.depotIdx:0;}
function depotStock(id){return stockFor(id,depotIdx());}
function depotPill(id){const t=U();const q=depotStock(id);const k=q<=0?'out':(q<10?'low':'in');const s=SHOW[depotIdx()];const city=lang==='ar'?s.city_ar:s.city;return `<span class="spill sp-${k}"><span class="dot"></span>${q>0?(num(q)+' · '+esc(city)):esc(t.w_out)+' · '+esc(city)}</span>`;}
function cartCount(){return Object.values(CART).reduce((a,b)=>a+b,0);}
function updateCartBadge(){const b=document.getElementById('cartbadge');if(b){const n=cartCount();b.textContent=n;b.style.display=n?'flex':'none';}}
function addToOrder(id,q,btn){q=q||1;if(depotStock(id)<=0)return;CART[id]=(CART[id]||0)+q;bizSave();updateCartBadge();if(btn){btn.classList.add('added');setTimeout(()=>btn.classList.remove('added'),900);}}
function qstep(d){const i=document.getElementById('qin');if(i)i.value=Math.max(1,(parseInt(i.value)||1)+d);}
function cartStep(id,d){if(d===-999){delete CART[id];}else{const q=(CART[id]||0)+d;if(q<=0)delete CART[id];else CART[id]=q;}bizSave();updateCartBadge();cartView();}
function signOut(){BIZ=null;CART={};bizSave();buildNav();go('');}
function renderBizBar(){const el=document.getElementById('bizbar');if(!el)return;if(!BIZ){el.replaceChildren();el.style.display='none';return;}const t=U();const s=SHOW[BIZ.depotIdx];el.style.display='block';el.replaceChildren();el.insertAdjacentHTML('beforeend',`<div class="bizbar-in"><span class="bizbar-l"><i class="ti ti-building-warehouse"></i> ${esc(t.w_acctlabel)} · <b>${esc(BIZ.biz)}</b> · ${esc(t.w_depot)}: <b>${esc(lang==='ar'?s.city_ar:s.city)}</b></span><span class="bizbar-r"><a onclick="go('manager')">${esc(t.w_mgr)}</a><a onclick="signOut()">${esc(t.w_signout)}</a></span></div>`);}
function wholesaleView(){ if(BIZ) return accountView(); const t=U();
  const cities=SHOW.map((s,i)=>`<option value="${i}">${esc(lang==='ar'?s.city_ar:s.city)}</option>`).join('');
  set(crumb([{t:t.home,h:''},{t:t.wholesale}])+`<div class="authwrap"><div class="authcard">
    <div class="bp-eyebrow2"><i class="ti ti-building-warehouse"></i> ${esc(t.w_portal)}</div>
    <h1 style="margin:6px 0 4px">${esc(t.w_signup)}</h1><div class="sub">${esc(t.w_signupsub)}</div>
    <label class="fl">${esc(t.w_biz)} *</label><input class="fi" id="f_biz" placeholder="${esc(t.w_bizph)}">
    <label class="fl">${esc(t.w_contact)}</label><input class="fi" id="f_contact" placeholder="${esc(t.w_contactph)}">
    <label class="fl">${esc(t.w_email)}</label><input class="fi" id="f_email" type="email" placeholder="name@shop.com">
    <label class="fl">${esc(t.w_city)} *</label><select class="fi" id="f_city">${cities}</select>
    <button class="authbtn" style="margin-top:18px" onclick="doSignup()"><i class="ti ti-arrow-right"></i> ${esc(t.w_create)}</button>
    <div class="authnote"><i class="ti ti-info-circle"></i> ${esc(t.w_approvenote)}</div>
  </div></div>`); navActive('wh');
}
function doSignup(){const biz=(document.getElementById('f_biz').value||'').trim()||'Demo Pet Shop';const contact=(document.getElementById('f_contact').value||'').trim();const email=(document.getElementById('f_email').value||'').trim();const ci=parseInt(document.getElementById('f_city').value)||0;BIZ={biz,contact,email,depotIdx:ci,approved:true};bizSave();buildNav();go('wholesale/welcome');}
function welcomeView(){if(!BIZ)return go('wholesale');const t=U();const s=SHOW[BIZ.depotIdx];set(`<div class="authwrap"><div class="authcard center"><div class="okcircle"><i class="ti ti-check"></i></div><h1>${esc(t.w_welcome)}</h1><p class="sub">${esc(t.w_assigned)} <b>${esc(lang==='ar'?s.city_ar:s.city)}</b>.<br>${esc(t.w_assignednote)}</p><button class="authbtn" onclick="go('catalog')"><i class="ti ti-building-store"></i> ${esc(t.w_browse)}</button></div></div>`);}
function accountView(){
  const t=U();const s=SHOW[BIZ.depotIdx];const inS=depotInStock(BIZ.depotIdx);const mgr=acctManager();
  const myOrders=ORDERS.filter(o=>o.biz===BIZ.biz);
  set(crumb([{t:t.home,h:''},{t:t.w_account}])+
   `<div class="dash-head"><div><div class="kicker">${esc(t.w_acctlabel)} · <span style="color:var(--ok-tx)">${esc(t.w_approved)}</span></div><div class="h1" style="margin:6px 0 2px">${esc(t.dash_hi)}, ${esc(BIZ.biz)}</div><div class="sub" style="margin:0">${esc(t.dash_sub)} <b>${esc(lang==='ar'?s.city_ar:s.city)}</b></div></div><button class="btn btn-ghost" onclick="signOut()"><i class="ti ti-logout"></i> ${esc(t.w_signout)}</button></div>
    <div class="dash-grid">
      <div class="dash-card dash-depot">
        <div class="dc-k"><i class="ti ti-building-warehouse"></i> ${esc(t.dash_depot)}</div>
        <div class="dc-city">${esc(lang==='ar'?s.city_ar:s.city)}</div>
        <div class="dc-stock"><span class="live-dot"></span><b>${num(inS)}</b> <span>${esc(t.dash_instock)}</span></div>
        <div class="dc-actions"><button class="btn btn-primary" onclick="go('catalog')"><i class="ti ti-building-store"></i> ${esc(t.w_browse)}</button><a class="btn btn-ghost" href="cash-and-carry/${slug(s.city)}.html">${esc(t.viewpage)}</a></div>
      </div>
      <div class="dash-card dash-mgr">
        <div class="dc-k"><i class="ti ti-headset"></i> ${esc(t.dash_mgr)}</div>
        <div class="mgr-id"><span class="mgr-av" style="background:${mgr.color}">${esc(mgr.initials)}</span><div><div class="mgr-nm">${esc(mgr.name)}</div><div class="mgr-role">${esc(t.dash_mgrrole)}</div></div></div>
        <div class="mgr-cta"><a class="btn btn-gold" href="https://wa.me/${mgr.wa}" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp"></i> WhatsApp</a><a class="btn btn-ghost" href="tel:${mgr.tel}"><i class="ti ti-phone"></i> ${esc(t.dash_call)}</a></div>
      </div>
    </div>
    <div class="sech" style="margin-top:34px"><i class="ti ti-receipt" style="color:var(--teal)"></i>${esc(t.dash_orders)}</div>
    ${myOrders.length?`<div class="dash-orders">${myOrders.map(o=>`<div class="do-row"><div class="do-l"><div class="do-no">${esc(o.no)}</div><div class="do-meta">${num(o.items.length)} ${esc(t.products)} · ${esc(ordDepot(o))}</div></div><div class="do-tot">${money(o.total)}</div><span class="mgr-st">${esc(ordStat(o))}</span><button class="btn btn-ghost do-re" onclick="reorder('${esc(o.no)}')"><i class="ti ti-refresh"></i> ${esc(t.dash_reorder)}</button></div>`).join('')}</div>`:`<div class="sempty" style="padding:28px 0">${esc(t.dash_noord)} <a onclick="go('catalog')" style="color:var(--teal);cursor:pointer">${esc(t.w_browse)}</a></div>`}`);
  navActive('wh');
}
function cartView(){const t=U();if(!BIZ)return go('wholesale');const ids=Object.keys(CART);const s=SHOW[BIZ.depotIdx];
  if(!ids.length){set(crumb([{t:t.home,h:''},{t:t.w_cart}])+`<div class="h1">${esc(t.w_cart)}</div><div class="sempty" style="padding:50px 0">${esc(t.w_empty)} <a onclick="go('catalog')" style="color:var(--teal);cursor:pointer">${esc(t.w_browse)}</a></div>`);return;}
  let total=0;
  const rows=ids.map(id=>{const p=S.products[id];const q=CART[id];const line=parseFloat(p.price)*q;total+=line;const dq=depotStock(id);return `<div class="crt-row"><img src="${esc(p.img)}"${IE} alt=""><div class="crt-info"><div class="crt-nm">${esc(pTitle(p))}</div><div class="crt-br">${esc(pBrand(p))} · ${money(p.price)}</div>${dq<q?`<div class="crt-warn"><i class="ti ti-alert-triangle"></i> ${esc(t.w_only)} ${dq} ${esc(t.instockq)}</div>`:''}</div><div class="qtybox sm"><button onclick="cartStep('${id}',-1)">−</button><input value="${q}" readonly><button onclick="cartStep('${id}',1)">+</button></div><div class="crt-line">${money(line.toFixed(2))}</div><button class="crt-rm" onclick="cartStep('${id}',-999)" aria-label="remove"><i class="ti ti-trash"></i></button></div>`;}).join('');

function animalView(a){
  if(!S.index[a]) return home();
  const t=U();
  const cards=Object.keys(S.index[a]).map(c=>{
    const o=S.index[a][c]; const rep=S.products[o.ids[0]];
    return `<div class="ccard" onclick="go('c/${encodeURIComponent(a)}/${encodeURIComponent(c)}')">
      <div class="cim"><img src="${esc(rep.img)}"${IE} alt=""></div>
      <div class="cb"><div class="cn">${esc(cLabel(c))}</div><div class="cc">${o.total.toLocaleString()} ${esc(t.products)}</div></div></div>`;
  }).join('');
  set(crumb([{t:t.home,h:''},{t:t.catalog,h:'catalog'},{t:aLabel(a)}])+
    `<div class="h1">${esc(aLabel(a))}</div><div class="sub">${esc(t.cats)}</div><div class="cgrid">${cards}</div>`);
  navActive('cat');
}
function categoryView(a,c){
  if(!S.index[a]||!S.index[a][c]) return home();
  const t=U(); const o=S.index[a][c];
  CURSUBS=[...new Set(o.ids.map(id=>(S.products[id].sub||'').split(',')[0].trim()).filter(Boolean))];
  const subrow=CURSUBS.length>1?`<div class="subrow"><button class="subchip on" onclick="filterSub(-1,this)">${esc(t.all)}</button>${CURSUBS.map((s,i)=>`<button class="subchip" onclick="filterSub(${i},this)">${esc(s)}</button>`).join('')}</div>`:'';
  const cards=o.ids.map(id=>prodCard(S.products[id])).join('');
  set(crumb([{t:t.home,h:''},{t:t.catalog,h:'catalog'},{t:aLabel(a),h:'a/'+encodeURIComponent(a)},{t:cLabel(c)}])+
    `<div class="h1">${esc(cLabel(c))}</div><div class="sub">${t.showing} ${o.ids.length} ${t.of} ${o.total.toLocaleString()} ${esc(t.products)}</div>${subrow}
     <div class="pgrid">${cards}</div>`);
  navActive('cat');
}
function prodCard(p){
  const t=U();let pill,act='';
  if(BIZ){const q=depotStock(p.id);pill=depotPill(p.id);act=`<div class="cardact"><button class="addord${q>0?'':' off'}" ${q>0?`onclick="event.stopPropagation();addToOrder('${p.id}',1,this)"`:'disabled'}><i class="ti ti-${q>0?'plus':'ban'}"></i>${q>0?esc(t.w_add):esc(t.w_out)}</button></div>`;}
  else{pill=stockPill(p.id);}
  return `<div class="pcard" data-sub="${esc((p.sub||'').split(',')[0].trim())}" onclick="go('p/${encodeURIComponent(p.id)}')">
    ${p.enr?`<span class="enr"><i class="ti ti-sparkles" style="font-size:12px"></i>${esc(U().enr)}</span>`:''}
    <div class="pim"><img src="${esc(p.img)}"${IE} alt="${esc(pTitle(p))}"></div>
    <div class="pb"><div class="pbrand">${esc(pBrand(p))}</div><div class="pname">${esc(pTitle(p))}</div><div class="prow"><div class="pprice">${money(p.price)}</div>${pill}</div>${act}</div></div>`;
}
function L(p,k){return lang==='ar'?(p[k+'ar']||p[k]||[]):(p[k]||[]);}
function pick(n,arr){for(const x of arr){const r=n.find(y=>(y[0]||'').toLowerCase().includes(x));if(r)return r;}return null;}
function productView(id){
  const p=S.products[id]; if(!p) return home();
  const t=U(); const a=p.pets[0]; const c=p.cats[a]||Object.values(p.cats)[0];
  const title=pTitle(p), brand=pBrand(p);
  const sub=lang==='ar'?(p.subar||p.sub):p.sub;
  const nutr=L(p,'nutr');
  const mc=[pick(nutr,['protein','بروتين']),pick(nutr,['fat content','محتوى الدهون']),pick(nutr,['calories','السعرات الح']),pick(nutr,['metaboliz','طاقة'])].filter(Boolean);
  let h=crumb([{t:t.home,h:''},{t:aLabel(a),h:'a/'+encodeURIComponent(a)},{t:cLabel(c),h:'c/'+encodeURIComponent(a)+'/'+encodeURIComponent(c)},{t:title}]);
  h+=`<div class="hero2">
    <div class="imgwrap" onclick="openLightbox(this.querySelector('img').src)"><img src="${esc(p.img)}"${IE} alt="${esc(title)}"><span class="zoomhint"><i class="ti ti-zoom-in"></i></span></div>
    <div>
      <div class="sub" style="margin-bottom:8px">${esc(cLabel(c))}${sub?' / '+esc(sub):''}</div>
      <h1 class="t">${esc(title)}</h1>
      <div class="badges"><span class="pill g">${esc(brand)}</span><span class="pill t"><i class="ti ti-paw"></i>${esc(aLabel(a))}</span>${p.enr?`<span class="pill p"><i class="ti ti-sparkles"></i>${esc(t.enr)}</span>`:''}</div>
      <div class="price">${money(p.price)}</div><div class="pricen">${esc(t.pn)}</div>
      ${p.size?`<div class="sizes"><span class="sl">${esc(t.size)}</span><span class="chip2">${esc(p.size)}</span></div>`:''}
      ${BIZ?`<div class="cta"><div class="qtybox"><button onclick="qstep(-1)">−</button><input id="qin" value="1" inputmode="numeric"><button onclick="qstep(1)">+</button></div><button class="add" ${depotStock(p.id)>0?`onclick="addToOrder('${p.id}',Math.max(1,parseInt(document.getElementById('qin').value)||1),this)"`:'disabled'}><i class="ti ti-${depotStock(p.id)>0?'plus':'ban'}" style="vertical-align:-3px;margin-inline-end:7px"></i>${depotStock(p.id)>0?esc(t.w_add):esc(t.w_out)}</button></div>`:`<div class="cta"><button class="add"><i class="ti ti-message-2" style="vertical-align:-3px;margin-inline-end:7px"></i>${esc(t.add)}</button><button class="ico"><i class="ti ti-bookmark"></i></button></div>`}
      <div class="meta">${esc(t.sku)} ${esc(p.sku)}${p.bc?' · '+esc(t.bc)+' '+esc(p.bc):''}</div>
      ${p.enr?`<div class="trust"><i class="ti ti-sparkles"></i>${esc(t.trust)}</div>`:''}
    </div></div>`;
  h+=`<div class="sec"><div class="sh"><i class="ti ti-building-store"></i>${esc(t.cc_stock)}<span class="livebadge"><span class="dot"></span>${esc(t.live)}</span></div><div class="cc-grid">${SHOW.map((s,i)=>{const q=stockFor(p.id,i);const k=q<=0?'out':(q<10?'low':'in');return `<a class="cc-row" href="cash-and-carry/${slug(s.city)}.html"><span class="cc-city"><i class="ti ti-map-pin"></i>${esc(lang==='ar'?s.city_ar:s.city)}</span><span class="cc-stk sp-${k}"><span class="dot"></span>${q>0?(num(q)+' '+esc(t.instockq)):esc(t.outstock)}</span></a>`;}).join('')}</div></div>`;
  h+=`<div class="sec"><div class="sh sh-sm"><i class="ti ti-shopping-bag"></i>${esc(t.alsoon)}</div><div class="ret-grid">${RETAILERS.map(r=>`<a class="ret-card" href="${r.u}" target="_blank" rel="noopener"><img src="${r.l}" alt="${esc(r.n)}"><div class="ret-nm">${esc(r.n)}${r.s?`<span class="ret-sub">${esc(r.s)}</span>`:''}</div></a>`).join('')}</div></div>`;
  if(!p.enr && !(p.desc||p.descar) && !nutr.length && !L(p,'ing').length){
    h+=`<div class="thin"><i class="ti ti-info-circle"></i>${esc(t.thin)}</div>`;
  }
  const feat=L(p,'feat');
  if(feat.length){h+=`<div class="sec"><div class="sh"><i class="ti ti-list-check"></i>${esc(t.kf)}</div><ul class="feat">${feat.map(f=>`<li><i class="ti ti-circle-check"></i><span>${esc(f)}</span></li>`).join('')}</ul></div>`;}
  if(mc.length){h+=`<div class="mcards">${mc.map(r=>`<div class="mc"><div class="l">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`).join('')}</div>`;}
  const ben=L(p,'ben');
  if(ben.length){h+=`<details open><summary><span class="lb"><i class="ti ti-rosette-discount-check"></i>${esc(t.ben)}</span><i class="ti ti-chevron-down cv"></i></summary><div class="bd"><div class="blist">${ben.map(b=>`<div class="bi"><i class="ti ti-check"></i><span>${esc(b)}</span></div>`).join('')}</div></div></details>`;}
  if(nutr.length){h+=`<details ${ben.length?'':'open'}><summary><span class="lb"><i class="ti ti-chart-bar"></i>${esc(t.nut)}</span><i class="ti ti-chevron-down cv"></i></summary><div class="bd"><div class="ntab">${nutr.map(n=>`<div class="nr"><span class="nl">${esc(n[0])}</span><span class="nv">${esc(n[1])}</span></div>`).join('')}</div></div></details>`;}
  const ing=L(p,'ing');
  if(ing.length){h+=`<details><summary><span class="lb"><i class="ti ti-leaf"></i>${esc(t.ing)} <span style="color:var(--faint);font-weight:400;font-size:13px">(${ing.length})</span></span><i class="ti ti-chevron-down cv"></i></summary><div class="bd"><div class="chips">${ing.map(i=>`<span class="ing">${esc(i)}</span>`).join('')}</div></div></details>`;}
  const desc=lang==='ar'?(p.descar||p.desc):p.desc;
  if(desc){h+=`<details><summary><span class="lb"><i class="ti ti-file-text"></i>${esc(t.desc)}</span><i class="ti ti-chevron-down cv"></i></summary><div class="bd"><p class="desc">${esc(desc)}</p></div></details>`;}
  const tags=L(p,'tags');
  if(tags.length){h+=`<div class="sec"><div class="sh"><i class="ti ti-tags"></i>${esc(t.tags)}</div><div class="chips">${tags.map(x=>`<span class="tg">${esc(x)}</span>`).join('')}</div></div>`;}
  const kw=L(p,'kw');
  if(kw.length){h+=`<div class="kw"><div class="kwn"><i class="ti ti-eye-off"></i>${esc(t.kw)}</div><div class="chips">${kw.map(x=>`<span class="kwc">${esc(x)}</span>`).join('')}</div></div>`;}
  if(p.enr){h+=`<div class="bloom"><i class="ti ti-sparkles"></i><span>${esc(t.foot)}</span></div>`;}
  const relIds=((S.index[a]&&S.index[a][c])?S.index[a][c].ids:[]).filter(x=>x!==id).slice(0,6);
  if(relIds.length){h+=`<div class="sec"><div class="sh"><i class="ti ti-layout-grid"></i>${esc(t.related)}</div><div class="pgrid">${relIds.map(rid=>prodCard(S.products[rid])).join('')}</div></div>`;}
  set(h);
  const sb=document.getElementById('stickybuy');
  if(sb){const ok=BIZ?depotStock(p.id)>0:true;const cta=BIZ?(ok?`<button class="btn btn-primary" onclick="addToOrder('${p.id}',1,this)"><i class="ti ti-plus"></i> ${esc(t.w_add)}</button>`:`<button class="btn btn-primary" disabled><i class="ti ti-ban"></i> ${esc(t.w_out)}</button>`):`<button class="btn btn-primary"><i class="ti ti-message-2"></i> ${esc(t.add)}</button>`;sb.insertAdjacentHTML('beforeend',`<div class="sb-info"><img src="${esc(p.img)}"${IE} alt=""><div><div class="sb-nm">${esc(title)}</div><div class="sb-pr">${money(p.price)}</div></div></div>${cta}`);initStickyBuy();}
  markNav(a);
}
function markNav(a){document.querySelectorAll('#navlinks a').forEach(e=>e.classList.toggle('on',e.dataset.a===a));}
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean).map(decodeURIComponent);
  renderBizBar();
  if(!parts.length) return home();
  if(parts[0]==='a') return animalView(parts[1]);
  if(parts[0]==='c') return categoryView(parts[1],parts[2]);
  if(parts[0]==='p') return productView(parts[1]);
  if(parts[0]==='s') return searchView(parts.slice(1).join('/'));
  if(parts[0]==='brands') return brandsView();
  if(parts[0]==='brand') return brandView(parts.slice(1).join('/'));
  if(parts[0]==='about') return aboutView();
  if(parts[0]==='catalog') return catalogView();
  if(parts[0]==='showrooms') return showroomsView();
  if(parts[0]==='wholesale') return parts[1]==='welcome'?welcomeView():wholesaleView();
  if(parts[0]==='cart') return cartView();
  if(parts[0]==='order') return orderDoneView();
  if(parts[0]==='manager') return managerView();
  home();
}
function setLang(){const t=U();document.body.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;document.getElementById('lng').textContent=t.tog;const qel=document.getElementById('q');if(qel)qel.placeholder=t.searchph;buildNav();renderFooter();}
document.getElementById('lng').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';setLang();route();});
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0);closeMenu();closeLightbox();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLightbox();return;}if(e.key==='Enter'||e.key===' '){var el=e.target;if(el&&el.hasAttribute&&el.hasAttribute('onclick')&&!/^(INPUT|TEXTAREA|BUTTON|SELECT)$/.test(el.tagName)&&!(el.tagName==='A'&&el.hasAttribute('href'))){e.preventDefault();el.click();}}});
function closeMenu(){var n=document.querySelector('.nav');if(n)n.classList.remove('open');}
document.getElementById('navtoggle').addEventListener('click',function(){document.querySelector('.nav').classList.toggle('open');});
(function(){const qel=document.getElementById('q');let db;qel.addEventListener('input',e=>{clearTimeout(db);db=setTimeout(()=>renderDrop(e.target.value),110);});qel.addEventListener('keydown',e=>{if(e.key==='Enter')goSearch();else if(e.key==='Escape'){closeSearch();qel.blur();}});qel.addEventListener('focus',e=>{if(e.target.value.trim())renderDrop(e.target.value);});document.addEventListener('click',e=>{if(!e.target.closest('#searchbox'))closeSearch();});})();
setLang();route();
</script></body></html>
